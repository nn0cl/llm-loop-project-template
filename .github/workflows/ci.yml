name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Version-claim checks need tags (CHANGELOG / README edition).
          fetch-tags: true

      # checkout's fetch-tags can still omit older tags on some runs; the
      # contract checker requires every released CHANGELOG heading to exist
      # as a tag (v2.0.0 … v2.3.0). Force a full tag fetch.
      - name: Fetch all git tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git tag -l 'v*' | sort -V | tail -20

      - name: Check required project documents
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "AGENTS.md"
            "CLAUDE.md"
            "CHANGELOG.md"
            "README.md"
            "README.ja.md"
            "QUICKSTART.md"
            "QUICKSTART.ja.md"
            ".gitignore"
            ".github/dependabot.yml"
            ".github/copilot-instructions.md"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/bug_report.md"
            ".github/ISSUE_TEMPLATE/config.yml"
            ".github/ISSUE_TEMPLATE/feature_request.md"
            ".grok/rules/01-quickstart.md"
            ".grok/rules/02-architecture-boundaries.md"
            ".grok/rules/03-collaboration-and-completion.md"
            ".cursor/rules/01-quickstart.mdc"
            ".cursor/rules/02-architecture-boundaries.mdc"
            ".cursor/rules/03-collaboration-and-completion.mdc"
            "docs/at-tdd/process.md"
            "docs/collaboration/ai-human-scheme.md"
            "docs/collaboration/personas.md"
            "docs/collaboration/design-agreement.md"
            "docs/collaboration/source-code-quality.md"
            "docs/collaboration/definition-of-done.md"
            "docs/collaboration/adoption-guide.md"
            "docs/collaboration/template-benefits.md"
            "docs/collaboration/project-start-guide.md"
            "docs/collaboration/process-gap-register.md"
            "docs/collaboration/ai-work-trace-log.md"
            "docs/collaboration/evaluation-and-golden-examples.md"
            "docs/collaboration/llm-cost-reduction.md"
            "docs/collaboration/model-tool-capability-matrix.md"
            "docs/collaboration/privacy-context-budget-policy.md"
            "docs/collaboration/branch-commit-pr-discipline.md"
            "docs/collaboration/local-issue-planning.md"
            "docs/collaboration/prompt-instruction-change-control.md"
            "docs/collaboration/session-start-and-resume.md"
            "docs/architecture/README.md"
            "docs/architecture/project-structure.md"
            "docs/architecture/testing-strategy.md"
            "docs/architecture/dependency-policy.md"
            "docs/architecture/tooling.md"
            "docs/architecture/ai-request-routing.md"
            "docs/architecture/io-reasoning-contracts.md"
            "docs/architecture/agent-quickstart.md"
            "docs/architecture/implementation-readiness.md"
            "docs/templates/design-intake.md"
            "docs/templates/agent-handoff.md"
            "docs/templates/ai-work-trace.md"
            "docs/templates/local-issue.md"
            "docs/templates/work-plan.md"
            "docs/templates/review-record.md"
            "docs/templates/self-review.md"
            "docs/templates/design-agreement.md"
            "docs/templates/gherkin-feature.md"
            "docs/templates/adr.md"
            "docs/templates/contract-file-sync-prompt.md"
            "docs/collaboration/traces/.gitkeep"
            "docs/collaboration/agreements/.gitkeep"
            "docs/collaboration/reviews/.gitkeep"
            "docs/issues/.gitkeep"
            "docs/work-plans/.gitkeep"
            "docs/spike/.gitkeep"
            "docs/spike/README.md"
            "docs/backlog/.gitkeep"
            "docs/backlog/README.md"
            "docs/templates/spike-case/case.md"
            "docs/templates/backlog-item.md"
            "docs/templates/loop-settings.toml"
            "docs/collaboration/loop-settings.md"
            "docs/collaboration/post-hoc-audit.md"
            "docs/collaboration/findings-reuse.md"
            "docs/evaluation/golden-examples/.gitkeep"
            "docs/evaluation/criteria/.gitkeep"
            "scripts/copy-ai-collaboration-files.sh"
            "scripts/update-ai-collaboration-files.sh"
            "scripts/init-llm-context.sh"
            "scripts/init-loop-settings.sh"
            "scripts/lib/collaboration-template-paths.sh"
            "scripts/check-contract-consistency.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: Check architecture decision records
        shell: bash
        run: |
          set -euo pipefail
          # Dynamic, contiguous-sequence check (LISS-0035) -- no hardcoded
          # ADR number list. WP-0007 introduced this; WP-0006 and WP-0004
          # each temporarily patched the step differently while 0017/0018
          # were not both present on their own branches (see ADR 0018's
          # "Numbering note"). Now that both are merged, the sequence is
          # contiguous again and the strict check applies unmodified.
          ls docs/architecture/adr/*.md >/dev/null
          expected=1
          for f in docs/architecture/adr/[0-9][0-9][0-9][0-9]-*.md; do
            n=$(basename "$f" | cut -c1-4)
            printf -v want '%04d' "$expected"
            if [ "$n" != "$want" ]; then
              echo "ADR sequence gap: expected ${want}, found ${n} (file: $f)" >&2
              exit 1
            fi
            expected=$((expected + 1))
          done

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/copy-ai-collaboration-files.sh \
            scripts/update-ai-collaboration-files.sh \
            scripts/init-llm-context.sh \
            scripts/init-loop-settings.sh \
            scripts/lib/collaboration-template-paths.sh \
            scripts/lib/emit-tooling-setup-prompt.sh

      - name: Check contract consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-contract-consistency.py --repo .

      - name: Check unresolved conflict markers
        shell: bash
        run: |
          set -euo pipefail
          # Match real conflict markers only: <<<<<<< / >>>>>>> prefixes, or a
          # line that is exactly seven '=' (git's separator). Do not match
          # longer banner lines of '=' used in prompts or docs.
          if git grep -n -E '^(<<<<<<<|=======$|>>>>>>>)' -- . ':!.git' >/tmp/conflict-markers.txt; then
            cat /tmp/conflict-markers.txt >&2
            exit 1
          fi

      - name: Check template copy smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/target"
          git init -q "$tmp/target"
          scripts/copy-ai-collaboration-files.sh \
            --target "$tmp/target" \
            --project-name "Smoke App" \
            --domain-summary "template smoke test" \
            --stack "test stack"
          scripts/init-llm-context.sh "$tmp/target" >/tmp/init-llm-context-smoke.txt
          test -f "$tmp/target/.gitignore"
          test -f "$tmp/target/docs/issues/.gitkeep"
          test -f "$tmp/target/docs/spike/.gitkeep"
          test -f "$tmp/target/docs/spike/README.md"
          test -f "$tmp/target/docs/backlog/.gitkeep"
          test -f "$tmp/target/docs/backlog/README.md"
          test -f "$tmp/target/docs/templates/spike-case/case.md"
          test -f "$tmp/target/docs/templates/backlog-item.md"
          test -f "$tmp/target/docs/templates/loop-settings.toml"
          test -f "$tmp/target/scripts/init-loop-settings.sh"
          test -f "$tmp/target/docs/collaboration/loop-settings.md"
          test -f "$tmp/target/docs/collaboration/post-hoc-audit.md"
          test -f "$tmp/target/docs/collaboration/findings-reuse.md"
          ! test -f "$tmp/target/docs/collaboration/loop-settings.toml"
          "$tmp/target/scripts/init-loop-settings.sh" --target "$tmp/target" --language ja --no-prompt
          test -f "$tmp/target/docs/collaboration/loop-settings.toml"
          grep -q 'language = "ja"' "$tmp/target/docs/collaboration/loop-settings.toml"
          "$tmp/target/scripts/init-loop-settings.sh" --target "$tmp/target" --prompt-only \
            | grep -q 'PASTE THE FOLLOWING INTO AN AI CODING AGENT'
          test -f "$tmp/target/scripts/lib/emit-tooling-setup-prompt.sh"
          test -f "$tmp/target/docs/collaboration/traces/.gitkeep"
          test -f "$tmp/target/docs/collaboration/agreements/.gitkeep"
          test -f "$tmp/target/docs/collaboration/reviews/.gitkeep"
          test -f "$tmp/target/docs/templates/design-agreement.md"
          test -f "$tmp/target/docs/templates/review-record.md"
          ! ls "$tmp/target/docs/collaboration/agreements/"*.md >/dev/null 2>&1
          ! ls "$tmp/target/docs/collaboration/reviews/"*.md >/dev/null 2>&1
          test -f "$tmp/target/docs/specs/.gitkeep"
          ! ls "$tmp/target/docs/issues/"LISS-*.md >/dev/null 2>&1
          ! ls "$tmp/target/docs/collaboration/traces/"*.md >/dev/null 2>&1
          ! ls "$tmp/target/docs/specs/"*.md >/dev/null 2>&1
          ! ls -d "$tmp/target/docs/spike/"case-* >/dev/null 2>&1
          ! ls "$tmp/target/docs/backlog/"item-*.md >/dev/null 2>&1
          ! ls "$tmp/target/docs/work-plans/"WP-*.md >/dev/null 2>&1
          test -f "$tmp/target/scripts/check-contract-consistency.py"
          (cd "$tmp/target" && python3 scripts/check-contract-consistency.py --repo .)
          if grep -R -n -i -E '<PROJECT_NAME: one-line description|<FILL IN: e\.g\. backend' \
            "$tmp/target/AGENTS.md" \
            "$tmp/target/CLAUDE.md" \
            "$tmp/target/.github/copilot-instructions.md" \
            "$tmp/target/.grok/rules" \
            "$tmp/target/.cursor/rules"; then
            echo "Copy script left basic project placeholders unfilled." >&2
            exit 1
          fi

      - name: Check agent operating contract change traceability
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          contract_changed=false
          trace_added=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Order matters: `case` globs let `*` match `/`, so the record
            # directories must be matched before the contract pattern that
            # would otherwise swallow them. Records are produced by following
            # the contract; they are not the contract.
            case "$f" in
              docs/collaboration/traces/*.md)
                trace_added=true
                ;;
              docs/collaboration/reviews/*.md|docs/collaboration/agreements/*.md)
                ;;
              AGENTS.md|CLAUDE.md|.github/copilot-instructions.md|.grok/rules/*.md|.cursor/rules/*.mdc|docs/at-tdd/process.md|docs/collaboration/*.md|docs/templates/*.md)
                contract_changed=true
                ;;
            esac
          done <<< "$changed_files"
          if [ "$contract_changed" = true ] && [ "$trace_added" = false ]; then
            echo "Agent operating contract files changed without an accompanying trace under docs/collaboration/traces/." >&2
            echo "See docs/collaboration/prompt-instruction-change-control.md." >&2
            exit 1
          fi

  # Add stack-specific jobs here once the implementation exists, for example:
  #
  # backend:
  #   name: Backend checks
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Run tests
  #       run: <your test command>
  #     - name: Run dependency policy check
  #       run: <e.g. cargo deny check, npm audit, pip-audit>
  #
  # frontend:
  #   name: Front-end checks
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Run checks
  #       run: <your lint/test command>
  #
  # Keep each job conditional on the relevant manifest existing
  # (e.g. `if: hashFiles('backend/Cargo.toml') != ''`) so this workflow stays
  # valid before the corresponding project is scaffolded.
